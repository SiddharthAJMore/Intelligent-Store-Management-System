spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grocery_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:+Q3SmJ1Mcpr0QKbFFw9u1Xo6L5IOdfRE2xWbp569EBgTXdMy074yRXdhLGdPZJtz}
    expiration: ${JWT_EXPIRATION:86400000}
logging:
  file:
    name: app.log
  level:
    root: INFO
    com.grocerystore: DEBUG

